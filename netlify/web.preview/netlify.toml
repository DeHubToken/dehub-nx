# Preview mirror must never index as a duplicate of the real site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/"
  to = "web/index.html"
  status = 200

[[redirects]]
  from = "/web/*"
  to = "web/index.html"
  status = 200

# Staking
[[redirects]]
  from = "/staking/*"
  to = "https://staking-dehub-preview.netlify.app/staking/:splat"
  status = 200
  force = true
